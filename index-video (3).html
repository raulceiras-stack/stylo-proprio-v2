  <style>
    :root {
      --terracota: #C1673A;
      --terracota-dark: #A0512C;
      --terracota-light: #D4845C;
      --beige: #F0E8DC;
      --beige-dark: #E2D3C0;
      --cream: #FAF6F1;
      --text-dark: #2C1F14;
      --text-mid: #6B4C35;
      --verde: #2E9E5B;
      --verde-dark: #23824A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--cream);
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── BANNER TOPO ── */
    .top-banner {
      width: 100%;
      background: var(--terracota);
      color: var(--beige);
      text-align: center;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── HERO ── */
    .hero {
      width: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
    }

    .hero-video {
      width: 100%;
      height: 54vh;
      max-height: 460px;
      object-fit: cover;
      object-position: top center;
      display: block;
      background: var(--beige-dark);
    }

    /* ── BOTÃO DE SOM ── */
    .sound-btn {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 22px;
      background: var(--terracota);
      color: var(--beige);
      border: none;
      border-radius: 50px;
      font-family: 'Jost', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      animation: pulse 1.6s ease-in-out infinite;
      z-index: 5;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .sound-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .sound-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) scale(0.9);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 6px 24px rgba(0,0,0,0.35), 0 0 0 0 rgba(193,103,58,0.55); }
      50% { box-shadow: 0 6px 24px rgba(0,0,0,0.35), 0 0 0 10px rgba(193,103,58,0); }
    }

    .hero-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(44,31,20,0.92) 0%, rgba(44,31,20,0.55) 55%, transparent 100%);
      padding: 48px 28px 36px;
      text-align: center;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 600;
      color: var(--beige);
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .hero-title em {
      font-style: italic;
      color: var(--terracota-light);
    }

    .hero-sub {
      font-size: 13px;
      color: var(--beige-dark);
      font-weight: 300;
      line-height: 1.6;
      letter-spacing: 0.3px;
    }

    /* ── CONTEÚDO ── */
    .content {
      width: 100%;
      max-width: 480px;
      padding: 22px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-mid);
      font-weight: 500;
      margin-bottom: 4px;
      align-self: center;
      text-align: center;
    }

    /* ── BOTÕES ── */
    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--terracota);
      color: var(--beige);
      box-shadow: 0 4px 20px rgba(193,103,58,0.35);
    }

    .btn-primary:hover {
      background: var(--terracota-dark);
      box-shadow: 0 6px 24px rgba(193,103,58,0.45);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--terracota);
      border: 1.5px solid var(--terracota);
    }

    .btn-outline:hover {
      background: rgba(193,103,58,0.06);
      transform: translateY(-1px);
    }

    /* ── BOTÕES DAS VENDEDORAS (verde + tremor) ── */
    .btn-vendedora {
      background: var(--verde);
      color: var(--beige);
      border: none;
      box-shadow: 0 4px 20px rgba(46,158,91,0.35);
      animation: tremor 2.6s ease-in-out infinite;
    }

    .btn-vendedora:hover {
      background: var(--verde-dark);
      box-shadow: 0 6px 24px rgba(46,158,91,0.45);
      animation-play-state: paused;
      transform: translateY(-1px);
    }

    .btn-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    /* divider */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--beige-dark);
      margin: 4px auto;
    }

    /* ── RODAPÉ / LOGO ── */
    .footer {
      width: 100%;
      max-width: 480px;
      padding: 20px 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      border-top: 1px solid var(--beige-dark);
    }

    .footer-tagline {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-mid);
      font-weight: 400;
      text-align: center;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .logo-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text-dark);
      letter-spacing: 1px;
    }

    .logo-sub {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-mid);
      font-weight: 400;
      margin-top: 2px;
    }

    /* ── ANIMAÇÕES ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes tremor {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-1px, 0) rotate(-0.4deg); }
      20% { transform: translate(1px, 0) rotate(0.4deg); }
      30% { transform: translate(-1px, 0.5px) rotate(-0.3deg); }
      40% { transform: translate(1px, -0.5px) rotate(0.3deg); }
      50% { transform: translate(0, 0) rotate(0deg); }
    }

    .top-banner  { animation: fadeUp 0.5s ease both; }
    .hero        { animation: fadeUp 0.6s ease 0.1s both; }
    .section-label { animation: fadeUp 0.5s ease 0.3s both; }
    .btn-primary { animation: fadeUp 0.5s ease 0.49s both; }
    .btn-vendedora-1 { animation: fadeUp 0.5s ease 0.35s both, tremor 2.6s ease-in-out 0.9s infinite; }
    .btn-vendedora-2 { animation: fadeUp 0.5s ease 0.42s both, tremor 2.6s ease-in-out 1.1s infinite; }
    .footer      { animation: fadeUp 0.5s ease 0.6s both; }
  </style>
